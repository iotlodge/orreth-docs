# PROVENANCE: Fable 5 (claude-fable-5) — 0064 The Open Book, the first world · 2026-08-31
# Your first Orreth world: ONE kernel image, TWO tiers, differing only by the
# JSON profile each container mounts. The topology is data.
#
#   uv run --with cryptography python mint_root.py   # once — mints your root key
#   docker compose up -d
#   curl localhost:4600/health                        # the universe
#   curl localhost:4601/health                        # the floor, joined under it
#   open http://localhost:4600/window                 # the console
services:
  pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: orreth
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  universe:
    image: ghcr.io/iotlodge/orrethd:0.71.477
    command: >
      --profile /profiles/first-universe.json --port 4600 --bind 0.0.0.0
      --store-dir /data/bodies --root-pub ${ORRETH_ROOT_PUB}
      --pg postgres://postgres:orreth@pg:5432/postgres
    ports: ["4600:4600"]
    volumes:
      - ./profiles:/profiles:ro
      - universe-bodies:/data/bodies
    depends_on:
      pg: { condition: service_healthy }
    restart: unless-stopped

  floor-main:
    image: ghcr.io/iotlodge/orrethd:0.71.477
    command: >
      --profile /profiles/first-floor.json --port 4601 --bind 0.0.0.0
      --parent http://universe:4600
      --store-dir /data/bodies --root-pub ${ORRETH_ROOT_PUB}
      --pg postgres://postgres:orreth@pg:5432/postgres
    ports: ["4601:4601"]
    volumes:
      - ./profiles:/profiles:ro
      - floor-bodies:/data/bodies
    depends_on:
      pg: { condition: service_healthy }
    restart: unless-stopped

  # The join door (optional — kernel 0.71 / orreth-agent 0.2.0): lets agents
  # knock and be admitted at YOUR word, while your root key stays in its file.
  # Mint the door's credential once (the root signs it offline, right here):
  #   uv run --with 'orreth-agent>=0.2' python -m orreth_agent.joindoor mint \
  #     --root-seed .root-seed --root-did did:web:example.com:u:first \
  #     --scope u:first/f:main --out door.json
  # Then `docker compose --profile door up -d`. Approvals stay yours:
  #   python -m orreth_agent.joindoor pending --field http://localhost:4601
  #   python -m orreth_agent.joindoor approve <req-id> --door door.json --field http://localhost:4601
  join-door:
    image: python:3.12-slim
    command: >
      sh -c "pip install -q 'orreth-agent>=0.2' &&
             python -m orreth_agent.joindoor serve
             --door /door.json --field http://floor-main:4601"
    volumes:
      - ./door.json:/door.json:ro
    depends_on:
      - floor-main
    restart: unless-stopped
    profiles: ["door"]

volumes:
  pg-data:
  universe-bodies:
  floor-bodies:
